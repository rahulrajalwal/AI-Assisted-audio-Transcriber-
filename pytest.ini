[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    slow: uses the real local all-MiniLM-L6-v2 embedding model (no network once cached)
    openrouter: makes one real OpenRouter request (set LIVE_OPENROUTER=1)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
